<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 额度</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7f9; --panel:#fff; --text:#202124; --muted:#81858d; --line:#e5e7eb; --soft:#f2f3f5; --green:#31bc88; --red:#dc5b56; --amber:#dcae00; --shadow:0 12px 32px rgba(24,28,36,.07); }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#121417; --panel:#1b1e23; --text:#eef0f3; --muted:#9399a3; --line:#30343b; --soft:#24282e; --shadow:none; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; }
    .page { max-width:1440px; margin:auto; padding:34px 38px 54px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    h1 { margin:0; font-size:28px; letter-spacing:-.6px; }
    .icon-button { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--line); border-radius:11px; background:var(--panel); cursor:pointer; }
    .icon-button:hover { border-color:#b9bec6; background:var(--soft); }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:20px; }
    .summary-card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:17px 20px; }
    .summary-value { display:block; margin-top:3px; font-size:25px; font-weight:750; }
    .muted { color:var(--muted); }
    .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .tabs { display:flex; padding:4px; gap:3px; background:var(--soft); border-radius:12px; }
    .tab { border:0; border-radius:9px; padding:8px 15px; background:transparent; cursor:pointer; }
    .tab.active { background:var(--panel); box-shadow:0 1px 5px rgba(0,0,0,.09); font-weight:650; }
    details { margin-left:auto; position:relative; }
    summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:7px; padding:8px 12px; border:1px solid var(--line); border-radius:11px; background:var(--panel); }
    summary::-webkit-details-marker { display:none; }
    .settings { position:absolute; z-index:5; right:0; top:48px; width:min(560px,calc(100vw - 36px)); padding:18px; border:1px solid var(--line); border-radius:15px; background:var(--panel); box-shadow:var(--shadow); }
    .settings label { display:block; font-weight:650; margin-bottom:8px; }
    .input-row { display:flex; gap:8px; }
    input { min-width:0; flex:1; padding:10px 12px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; outline:none; }
    input:focus { border-color:#7d8998; }
    .button { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 13px; cursor:pointer; white-space:nowrap; }
    .button.primary { background:#25272b; color:white; border-color:#25272b; }
    .setting-meta { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:9px; color:var(--muted); font-size:12px; }
    .banner { display:none; margin-bottom:18px; padding:12px 15px; color:#9d302c; background:#fff0ef; border:1px solid #efc2bf; border-radius:12px; white-space:pre-wrap; }
    .banner.show { display:block; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .account-card { position:relative; min-height:220px; padding:22px 24px; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); }
    .account-head { display:flex; align-items:center; gap:13px; padding-right:86px; }
    .plan { min-width:58px; padding:8px 11px; text-align:center; border:1px solid var(--line); border-radius:13px; color:#6f737a; background:var(--soft); font-size:12px; font-weight:800; letter-spacing:.7px; }
    .plan.plus { color:#16734f; border-color:#9ed7bd; background:linear-gradient(145deg,#e9f8f0,#cceedd); }
    .plan.pro { color:#7c5c00; border-color:#dcc56f; background:linear-gradient(145deg,#fff4bc,#e5c65e); box-shadow:inset 0 1px rgba(255,255,255,.7); }
    .plan.team { color:#68439a; border-color:#c4a8e9; background:linear-gradient(145deg,#f1e9fc,#ddcaf4); }
    .account-name { min-width:0; font-size:17px; font-weight:720; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .head-actions { position:absolute; right:20px; top:20px; display:flex; align-items:center; gap:8px; }
    .status { display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:999px; font-size:12px; color:#21825d; background:#eaf7f1; }
    .status::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .status.error { color:#bc4843; background:#fcedec; }
    .status.waiting { color:#8a7540; background:#f8f2df; }
    .refresh { border:0; background:transparent; width:30px; height:30px; display:grid; place-items:center; cursor:pointer; border-radius:9px; color:var(--muted); }
    .refresh:hover { color:var(--text); background:var(--soft); }
    .refresh:disabled { cursor:not-allowed; opacity:.45; }
    .refresh.loading svg { animation:spin .75s linear infinite; }
    .quota-list { margin-top:20px; display:grid; gap:15px; }
    .quota-top { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; }
    .quota-label { font-weight:650; }
    .quota-value { font-weight:720; }
    .quota-reset { margin-left:8px; color:var(--muted); font-weight:400; font-size:12px; }
    .track { height:8px; border-radius:10px; overflow:hidden; background:var(--soft); }
    .fill { height:100%; border-radius:inherit; background:var(--green); }
    .fill.low { background:var(--amber); }
    .fill.empty { background:var(--red); }
    .account-error { margin-top:16px; padding:10px 12px; color:#a23d38; background:#fff1f0; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
    .empty { grid-column:1/-1; padding:70px 20px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:18px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:840px) { .page{padding:22px 16px 40px}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-wrap:wrap}details{margin-left:0}.account-card{padding:18px}.head-actions{right:14px;top:16px}.account-head{padding-right:78px}.input-row{flex-wrap:wrap}.input-row input{flex-basis:100%} }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1>Codex 额度</h1>
      <button id="theme-button" class="icon-button" type="button" title="切换主题" aria-label="切换主题">◐</button>
    </header>

    <section class="summary" aria-label="账号概况">
      <div class="summary-card"><span class="muted">账号</span><strong id="count-all" class="summary-value">—</strong></div>
      <div class="summary-card"><span class="muted">正常</span><strong id="count-normal" class="summary-value">—</strong></div>
      <div class="summary-card"><span class="muted">异常 / 等待</span><strong id="count-other" class="summary-value">—</strong></div>
    </section>

    <div id="banner" class="banner" role="alert"></div>

    <section class="toolbar">
      <nav id="tabs" class="tabs" aria-label="账号筛选">
        <button class="tab active" type="button" data-filter="all">全部</button>
        <button class="tab" type="button" data-filter="normal">正常</button>
        <button class="tab" type="button" data-filter="error">异常</button>
        <button class="tab" type="button" data-filter="waiting">等待</button>
      </nav>
      <details id="settings-details">
        <summary>⚙ User-Agent</summary>
        <div class="settings">
          <label for="ua-input">刷新额度请求 User-Agent</label>
          <div class="input-row">
            <input id="ua-input" type="text" autocomplete="off" spellcheck="false">
            <button id="ua-save" class="button primary" type="button">保存</button>
            <button id="ua-reset" class="button" type="button">恢复继承</button>
          </div>
          <div class="setting-meta"><span id="ua-source"></span><span id="ua-message"></span></div>
        </div>
      </details>
    </section>

    <section id="account-grid" class="grid" aria-live="polite">
      <div class="empty">正在读取账号……</div>
    </section>
  </main>
  <script type="module" src="./panel-app.mjs"></script>
</body>
</html>
