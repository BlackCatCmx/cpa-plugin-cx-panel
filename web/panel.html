<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 额度</title>
  <style>
    :root {
      color-scheme: light;
      --bg-page:#faf9f5; --bg-card:#f0eee8; --bg-soft:#e9e6df; --bg-float:#fffdf9;
      --text:#2d2a26; --text-2:#6d6760; --text-3:#a29c95; --border:#e3e1db;
      --border-hover:#cecac4; --green:#10b981; --amber:#e0aa14; --red:#c65746;
      --red-bg:rgba(198,87,70,.1); --red-border:rgba(198,87,70,.35);
      --shadow:0 12px 26px -18px rgba(0,0,0,.22);
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme:dark; --bg-page:#151412; --bg-card:#1d1b18; --bg-soft:#262320; --bg-float:#2a2723;
      --text:#f6f4f1; --text-2:#c9c3bb; --text-3:#9c958d; --border:#3a3530; --border-hover:#5a544d;
      --green:#0fae78; --amber:#ffd862; --red:#cf4b3a; --red-bg:rgba(198,87,70,.18);
      --red-border:rgba(198,87,70,.45); --shadow:0 14px 30px -18px rgba(0,0,0,.65);
    }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:var(--bg-page); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; }
    button:focus-visible,input:focus-visible { outline:2px solid color-mix(in srgb,var(--text-2) 65%,transparent); outline-offset:2px; }
    .page { width:min(1480px,100%); margin:0 auto; padding:30px 28px 44px; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px; }
    .eyebrow { display:flex; align-items:center; gap:8px; margin-bottom:8px; color:var(--text-3); font:700 11px var(--mono); letter-spacing:.12em; }
    .eyebrow-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 12%,transparent); }
    h1 { margin:0; font-size:clamp(26px,3vw,34px); line-height:1.15; letter-spacing:-.035em; }
    .icon-button { display:grid; place-items:center; width:36px; height:36px; padding:0; border:1px solid var(--border); border-radius:10px; background:color-mix(in srgb,var(--bg-card) 72%,transparent); color:var(--text-2); cursor:pointer; }
    .icon-button:hover { border-color:var(--border-hover); background:var(--bg-soft); color:var(--text); }
    .icon-button svg { width:16px; height:16px; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:14px; overflow:hidden; border:1px solid var(--border); border-radius:14px; background:color-mix(in srgb,var(--bg-card) 62%,transparent); }
    .summary-item { min-width:0; padding:15px 17px; }
    .summary-item + .summary-item { border-left:1px solid var(--border); }
    .summary-label { margin-bottom:6px; color:var(--text-3); font-size:11px; }
    .summary-value { display:flex; align-items:baseline; gap:7px; font:700 18px var(--mono); }
    .summary-note { color:var(--text-3); font:500 10.5px var(--sans); }
    .summary-error { color:var(--red); }
    .banner { display:none; margin-bottom:14px; padding:10px 12px; color:var(--red); background:var(--red-bg); border:1px solid var(--red-border); border-radius:10px; white-space:pre-wrap; }
    .banner.show { display:block; }
    .settings-shell { margin-bottom:14px; border:1px solid var(--border); border-radius:12px; background:color-mix(in srgb,var(--bg-card) 62%,transparent); }
    .settings-shell summary { display:flex; align-items:center; gap:8px; padding:11px 14px; color:var(--text-2); cursor:pointer; font-size:12px; font-weight:650; list-style:none; user-select:none; }
    .settings-shell summary::-webkit-details-marker { display:none; }
    .settings-shell summary svg { width:15px; height:15px; }
    .settings-shell summary .chevron { margin-left:auto; transition:transform 180ms ease; }
    .settings-shell[open] summary .chevron { transform:rotate(180deg); }
    .settings { display:grid; grid-template-columns:minmax(180px,.75fr) minmax(360px,2fr) auto; align-items:end; gap:14px; padding:14px 16px 15px; border-top:1px solid var(--border); }
    .settings-title { align-self:center; min-width:0; }
    .settings-title strong { display:block; margin-bottom:5px; font-size:13px; }
    .settings-title span { display:block; color:var(--text-3); font-size:11px; line-height:1.45; }
    .field-label { display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; color:var(--text-2); font-size:11px; font-weight:650; }
    .source-tag { color:var(--text-3); font:500 10px var(--mono); }
    .ua-input { width:100%; height:36px; padding:0 11px; border:1px solid var(--border); border-radius:9px; background:var(--bg-page); color:var(--text); font:11px var(--mono); }
    .settings-actions { display:flex; gap:8px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:7px 13px; border:1px solid var(--border); border-radius:10px; background:color-mix(in srgb,var(--bg-card) 72%,transparent); color:var(--text-2); cursor:pointer; font-size:12px; font-weight:650; white-space:nowrap; }
    .button:hover { border-color:var(--border-hover); background:var(--bg-soft); color:var(--text); }
    .button.primary { background:var(--text); border-color:var(--text); color:var(--bg-page); }
    .setting-message { min-height:16px; align-self:center; color:var(--text-3); font-size:11px; }
    .workbench-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:13px; }
    .tabs { display:flex; gap:5px; padding:3px; border:1px solid var(--border); border-radius:10px; background:color-mix(in srgb,var(--bg-card) 65%,transparent); }
    .tab { padding:6px 11px; border:0; border-radius:7px; background:transparent; color:var(--text-3); cursor:pointer; font-size:11.5px; font-weight:650; white-space:nowrap; }
    .tab.active { background:var(--bg-float); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .poll-state { color:var(--text-3); font:10.5px var(--mono); }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
    .account-card { display:flex; flex-direction:column; gap:12px; min-width:0; padding:16px; border:1px solid var(--border); border-radius:14px; background:color-mix(in srgb,var(--bg-card) 82%,transparent); box-shadow:var(--shadow); transition:180ms ease; }
    .account-card:hover { transform:translateY(-2px); border-color:var(--border-hover); }
    .account-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .identity { display:flex; align-items:center; gap:10px; min-width:0; }
    .plan { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; height:24px; padding:2px 9px; border:1px solid var(--border); border-radius:999px; background:var(--bg-soft); color:var(--text-2); box-shadow:0 1px 2px rgba(0,0,0,.06); font-size:10.5px; font-weight:750; line-height:1; letter-spacing:.025em; }
    .plan.plus { border-color:rgba(16,185,129,.38); background:linear-gradient(135deg,#ecfdf5,#a7f3d0); color:#087653; }
    .plan.pro { border-color:rgba(217,165,22,.72); background:radial-gradient(circle at 18% 24%,#fff 0%,rgba(255,255,255,.3) 35%,transparent 43%),linear-gradient(135deg,#fff9e3 0%,#ffe07f 52%,#e0aa14 100%); color:#6b4b00; box-shadow:0 0 13px rgba(255,214,98,.25); }
    .plan.team { border-color:rgba(139,92,246,.38); background:linear-gradient(135deg,#f5f3ff,#c4b5fd); color:#6740bd; }
    :root[data-theme="dark"] .plan.plus { background:linear-gradient(135deg,#12352b,#176149); color:#a7f3d0; }
    :root[data-theme="dark"] .plan.pro { background:linear-gradient(135deg,#4f3d0b,#8f6d10); color:#fff0a8; }
    :root[data-theme="dark"] .plan.team { background:linear-gradient(135deg,#281f46,#483580); color:#ddd6fe; }
    .account-name { min-width:0; overflow:hidden; color:var(--text); font-size:12px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
    .head-actions { display:flex; align-items:center; gap:7px; flex:0 0 auto; }
    .status { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border:1px solid color-mix(in srgb,var(--green) 30%,transparent); border-radius:999px; color:color-mix(in srgb,var(--green) 76%,var(--text)); background:color-mix(in srgb,var(--green) 8%,transparent); font-size:10px; font-weight:700; }
    .status::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
    .status.error { color:var(--red); border-color:var(--red-border); background:var(--red-bg); }
    .status.waiting { color:var(--text-3); border-color:var(--border); background:color-mix(in srgb,var(--bg-soft) 62%,transparent); }
    .refresh { display:inline-grid; place-items:center; width:28px; height:28px; padding:0; border:1px solid var(--border); border-radius:999px; background:color-mix(in srgb,var(--bg-card) 72%,transparent); color:var(--text-2); cursor:pointer; }
    .refresh:hover { border-color:var(--border-hover); background:var(--bg-soft); color:var(--text); }
    .refresh:disabled { cursor:wait; opacity:.55; }
    .refresh.loading svg { animation:spin .8s linear infinite; }
    .account-error { display:flex; align-items:flex-start; gap:8px; padding:9px 10px; border:1px solid var(--red-border); border-radius:9px; background:var(--red-bg); color:var(--red); font:11px/1.45 var(--mono); white-space:pre-wrap; word-break:break-word; }
    .account-error::before { content:"!"; display:inline-grid; place-items:center; flex:0 0 auto; width:15px; height:15px; margin-top:.5px; border:1.5px solid currentColor; border-radius:50%; font:800 10px/1 var(--sans); }
    .quota-list { display:flex; flex-direction:column; gap:12px; }
    .quota-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .quota-label { overflow:hidden; color:var(--text-2); font-size:12px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .quota-value { display:flex; align-items:baseline; gap:7px; flex:0 0 auto; color:var(--text); font:750 11.5px var(--mono); }
    .quota-reset { color:var(--text-3); font-size:10.5px; font-weight:500; }
    .track { height:6px; overflow:hidden; border-radius:999px; background:color-mix(in srgb,var(--text) 8%,transparent); }
    .fill { height:100%; border-radius:inherit; background:var(--green); transition:width 420ms cubic-bezier(.23,1,.32,1); }
    .fill.low { background:var(--amber); }
    .fill.empty { background:var(--red); }
    .account-empty { display:grid; place-items:center; min-height:116px; padding:18px; border:1px dashed var(--border); border-radius:10px; color:var(--text-3); text-align:center; }
    .empty { grid-column:1/-1; padding:70px 20px; color:var(--text-3); text-align:center; border:1px dashed var(--border); border-radius:14px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:1100px) { .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:880px) { .settings{grid-template-columns:1fr}.settings-actions{justify-content:flex-end} }
    @media (max-width:700px) { .page{padding:20px 15px 34px}.summary{grid-template-columns:repeat(2,1fr)}.summary-item:nth-child(3){border-left:0;border-top:1px solid var(--border)}.summary-item:nth-child(4){border-top:1px solid var(--border)}.workbench-head{align-items:flex-start;flex-direction:column}.tabs{width:100%;overflow-x:auto}.grid{grid-template-columns:1fr} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important;transition:none!important} }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div><div class="eyebrow"><span class="eyebrow-dot"></span>CPA CX PANEL · CODEX</div><h1>Codex 额度</h1></div>
      <button id="theme-button" class="icon-button" type="button" title="切换主题" aria-label="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9c0-.7-.08-1.37-.23-2.02A7 7 0 0 1 12 3Z"/></svg></button>
    </header>
    <section class="summary" aria-label="额度总览">
      <div class="summary-item"><div class="summary-label">Codex 凭证</div><div class="summary-value"><span id="count-all">—</span><span class="summary-note">个账号</span></div></div>
      <div class="summary-item"><div class="summary-label">已有额度</div><div class="summary-value"><span id="count-quota">—</span><span class="summary-note">个账号</span></div></div>
      <div class="summary-item"><div class="summary-label">当前异常</div><div class="summary-value summary-error"><span id="count-error">—</span><span class="summary-note">需在凭证页处理</span></div></div>
      <div class="summary-item"><div class="summary-label">自动更新</div><div class="summary-value">10s</div></div>
    </section>
    <div id="banner" class="banner" role="alert"></div>
    <details id="settings-details" class="settings-shell">
      <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.16.38.37.72.6 1 .3.35.69.56 1.1.6h.1v4h-.1c-.41.04-.8.25-1.1.6-.23.28-.44.62-.6 1Z"/></svg>刷新请求设置<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 10 5 5 5-5"/></svg></summary>
      <div class="settings">
        <div class="settings-title"><strong>刷新请求 User-Agent</strong><span>仅用于此页面的额度刷新，不修改 CPA 正常模型请求。</span></div>
        <label><span class="field-label"><span>实际请求 UA</span><span id="ua-source" class="source-tag"></span></span><input id="ua-input" class="ua-input" type="text" autocomplete="off" spellcheck="false"></label>
        <div class="settings-actions"><button id="ua-reset" class="button" type="button">恢复继承</button><button id="ua-save" class="button primary" type="button">保存 UA</button></div>
        <span></span><span id="ua-message" class="setting-message"></span>
      </div>
    </details>
    <section>
      <div class="workbench-head">
        <nav id="tabs" class="tabs" aria-label="账号筛选">
          <button class="tab active" type="button" data-filter="all">全部 <span id="tab-all">0</span></button>
          <button class="tab" type="button" data-filter="normal">正常 <span id="tab-normal">0</span></button>
          <button class="tab" type="button" data-filter="error">异常 <span id="tab-error">0</span></button>
          <button class="tab" type="button" data-filter="waiting">等待数据 <span id="tab-waiting">0</span></button>
        </nav>
        <div id="poll-state" class="poll-state">正在更新</div>
      </div>
      <section id="account-grid" class="grid" aria-live="polite"><div class="empty">正在读取账号……</div></section>
    </section>
  </main>
  <script type="module" src="./panel-app.mjs"></script>
</body>
</html>
